name: EmployML CI / Automated Quality & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Code Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax
        run: |
      - name: Verify Code Syntax
        run: |
          python -m py_compile src/artifacts.py src/candidate.py src/cli.py src/features.py src/simulation.py src/simulation_v2.py src/theme.py src/app.py tests/conftest.py tests/test_artifacts.py tests/test_candidate.py tests/test_preprocessing.py tests/test_prediction.py tests/test_simulation.py tests/test_app_logic.py tests/test_preprocessor.py

      - name: Run Test Suite
        run: |
          python -m pytest -v --cov=src --cov-report=term-missing
          python tests/test_preprocessor.py
